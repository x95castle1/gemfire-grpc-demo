name: gemfire-01-crud-basics

# ---------------------------------------------------------------------------
# Shared GemFire member settings
# ---------------------------------------------------------------------------
x-gemfire: &gemfire
  image: ${GEMFIRE_IMAGE}
  environment:
    ACCEPT_TERMS: "y"
    # Load the gRPC extension (.gfm) from the mounted vendor folder.
    GEMFIRE_EXTENSIONS_REPOSITORY_PATH: /vendor
  volumes:
    - ${VENDOR_DIR}/${GRPC_EXTENSION_FILE}:/vendor/${GRPC_EXTENSION_FILE}:ro
    - ./gemfire:/scripts:ro
  healthcheck:
    # Healthy once the member logs that its gRPC service started. (Probing port 50051 directly
    # skews the extension's grpc.server.connections stat — see README "Findings".)
    test: ["CMD", "bash", "-c", "grep -qE 'gRPC Cache Server started|Initialized cache service com.vmware.gemfire.grpc.locator' /data/*.log"]
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 15s

x-client: &client
  environment: &client-env
    EXAMPLE: 01-crud-basics
    MODE: ${MODE}
    BENCH_DURATION: ${BENCH_DURATION}
    CONCURRENCY: ${CONCURRENCY}
    TARGET_RATE: ${TARGET_RATE}
    KEY_SPACE: ${KEY_SPACE}
    PAYLOAD_BYTES: ${PAYLOAD_BYTES}
    REGION: crud
  depends_on:
    gfsh-init: { condition: service_completed_successfully }

services:
  # -------------------------------------------------------------------------
  # GemFire cluster: 1 locator + 2 servers, gRPC extension on every member
  # -------------------------------------------------------------------------
  locator:
    <<: *gemfire
    hostname: locator
    command: ["bash", "/scripts/start-member.sh", "locator"]

  server1:
    <<: *gemfire
    hostname: server1
    command: ["bash", "/scripts/start-member.sh", "server"]
    depends_on:
      locator: { condition: service_healthy }

  server2:
    <<: *gemfire
    hostname: server2
    command: ["bash", "/scripts/start-member.sh", "server"]
    depends_on:
      locator: { condition: service_healthy }

  # One-shot: create regions and print extension info, then exit 0.
  gfsh-init:
    image: ${GEMFIRE_IMAGE}
    environment:
      ACCEPT_TERMS: "y"
    volumes:
      - ./gemfire:/scripts:ro
    command: ["gfsh", "run", "--file=/scripts/init.gfsh"]
    depends_on:
      server1: { condition: service_healthy }
      server2: { condition: service_healthy }

  # -------------------------------------------------------------------------
  # Clients: the same workload over gRPC and over the native Java client
  # -------------------------------------------------------------------------
  grpc-client-java:
    <<: *client
    build:
      context: ./grpc-client-java
      additional_contexts:
        vendor: ${VENDOR_DIR}
    environment:
      <<: *client-env
      # Direct connection to one server (xDS discovery is covered in 05-xds-discovery).
      GRPC_TARGET: dns:///server1:50051

  native-client-java:
    <<: *client
    build:
      context: ./native-client-java
      args:
        GEMFIRE_IMAGE: ${GEMFIRE_IMAGE}
    environment:
      <<: *client-env
      LOCATOR_HOST: locator
      LOCATOR_PORT: "10334"

  # -------------------------------------------------------------------------
  # Monitoring
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/crud-native-vs-grpc.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on: [prometheus]

  # Per-container CPU / memory, so client resource cost can be compared too.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
