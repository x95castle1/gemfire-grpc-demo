# The HTTP side is identical in every Java client, so the comparison only measures GemFire.
spring.main.banner-mode=off
server.port=${PORT:8080}
# A fixed pool of HTTP_THREADS platform threads, all started up front.
server.tomcat.threads.max=${HTTP_THREADS:64}
server.tomcat.threads.min-spare=${HTTP_THREADS:64}
server.tomcat.accept-count=1024
# k6 keeps its connections open for the whole run; by default Tomcat closes one every 100 requests.
server.tomcat.max-keep-alive-requests=-1

# Native client only: GemFire logs through log4j-api, which Spring Boot routes to Logback.
logging.level.org.apache.geode=warn
logging.level.com.vmware.gemfire=warn
