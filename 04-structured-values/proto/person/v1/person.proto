// The structured value this example stores: a Person, packed into google.protobuf.Any.
//
// The Go client generates its types from this file, and gemfire/Dockerfile compiles it into the
// descriptor JAR that gfsh-init deploys, so OQL can query into its fields (p.address.city, ...).
syntax = "proto3";

package person.v1;

option go_package = "grpc-client-go/gen/personv1";

message Person {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  int32 age = 4;
  repeated string nicknames = 5;
  Address address = 6;   // unset for every 10th person the client generates
  Role role = 7;
  bool active = 8;
}

message Address {
  string city = 1;
  string country = 2;
  repeated string lines = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ENGINEER = 1;
  MANAGER = 2;
  DESIGNER = 3;
}
