# TLS for the gRPC endpoints only (servers and the locator's xDS endpoint). gfsh, the locator and
# server protocols and the Prometheus HTTP endpoint stay plaintext (no other ssl components).
ssl-enabled-components=grpc
ssl-keystore=/certs/server.p12
ssl-keystore-password=changeit
ssl-keystore-type=PKCS12
ssl-grpc-alias=grpc-server
# One-way TLS: the servers prove who they are; clients don't need certificates. Set explicitly:
# without it the servers asked every client for a certificate ("tls: certificate required").
ssl-require-authentication=false
