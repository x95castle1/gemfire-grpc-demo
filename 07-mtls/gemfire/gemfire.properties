# Mutual TLS for the gRPC endpoints only (servers and the locator's xDS endpoint). gfsh, the locator
# and server protocols and the Prometheus HTTP endpoint stay plaintext (no other ssl components).
ssl-enabled-components=grpc
# Who the servers are: their key and certificate.
ssl-keystore=/certs/server.p12
ssl-keystore-password=changeit
ssl-keystore-type=PKCS12
ssl-grpc-alias=grpc-server
# Who they let in: clients with a certificate signed by the demo CA.
ssl-truststore=/certs/truststore.p12
ssl-truststore-password=changeit
ssl-truststore-type=PKCS12
ssl-require-authentication=true
