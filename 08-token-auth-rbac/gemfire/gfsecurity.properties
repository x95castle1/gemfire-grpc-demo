# One SecurityManager guards the whole cluster: gRPC calls (bearer tokens), members joining and gfsh
# (username/password). See ../security/src/demo/security/JwtSecurityManager.java.
security-manager=demo.security.JwtSecurityManager

# This member's own credentials, to join the cluster.
security-username=cluster
security-password=cluster-secret

# The SecurityManager's three built-in users (read in its init()). Demo passwords, not secrets.
#   cluster  members joining          admin  gfsh, everything          metrics  Prometheus (CLUSTER:READ)
security-cluster-password=cluster-secret
security-admin-password=admin-secret
security-metrics-password=metrics-secret
