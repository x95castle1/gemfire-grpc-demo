global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The client's metrics: demo_calls_total{channel,server}, demo_op_latency_seconds, demo_rpc_duration_seconds, ...
  - job_name: clients
    static_configs:
      - targets: ["grpc-client-go:8080"]
        labels: { service: grpc-client-go }

  # GemFire members (HTTP service). Here GemFire statistics are sampled every 5s
  # (gemfire.prometheus.metrics.interval, 15s in the other examples) so the low-memory demo's
  # few seconds above the critical threshold show up in the heap panel.
  # GemFire's own `instance` label (stat instance, e.g. "/orders") becomes `exported_instance`.
  - job_name: gemfire
    scrape_interval: 5s
    metrics_path: /metrics/
    static_configs:
      - targets: ["locator:7070"]
        labels: { node: locator }
      - targets: ["server1:7070"]
        labels: { node: server1 }
      - targets: ["server2:7070"]
        labels: { node: server2 }

  # Per-container CPU / memory, limited to this example's compose project.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: gemfire-10-error-handling
        action: keep
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total)
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_.*
        action: labeldrop
